# 放到你 fork 的 .github/workflows/HGhub-apk-build.yml（v4）
#
# v4 修的两个真实报错（来自 v3 的构建日志）：
#   A. rquickjs-sys 的 bindgen 报 "Unversioned target triples are not supported!"
#      —— NDK r27+ 的 sys/cdefs.h 拒绝无 API 级别的三元组。
#      修法：给 bindgen 追加 --target=aarch64-linux-android24（会定义 __ANDROID_API__）。
#   B. 指定的 NDK 28.2 没装上，Gradle 只能用镜像自带的 NDK 30。
#      修法：不再硬编码 NDK 版本，改为「探测实际安装的 NDK」，并把 gradle 的 ndkVersion 对齐到它。
name: HGhub Android APK (self-build)

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "24"          # 与 tauri.conf.json 的 minSdkVersion 一致
  KEY_ALIAS: "hghub"
  KS_PASS: "hghub-selfbuild"

jobs:
  apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # rquickjs-sys 用 bindgen 生成绑定，需要 libclang
      - name: Install native build helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev llvm pkg-config
          clang --version | head -1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -u
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then echo "::error::sdkmanager not found at $SDKM"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-35" "platforms;android-36" \
                     "build-tools;35.0.0" "build-tools;36.0.0"; do
            echo "=== $pkg ==="
            "$SDKM" --install "$pkg" >/dev/null && echo "OK: $pkg" || echo "::warning::FAILED $pkg"
          done

      # 关键修复 B：探测真实 NDK，而不是假设某个版本存在
      - name: Detect NDK + set bindgen clang args
        run: |
          set -eu
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${NDK:-}" ]; then
            echo "镜像没有 NDK，尝试安装 28.2"
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" || true
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "${NDK:-}" ]; then echo "::error::仍然没有 NDK"; exit 1; fi

          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_VERSION_DETECTED=$(basename "$NDK")" >> "$GITHUB_ENV"
          # 关键修复 A：带 API 级别的三元组 + NDK sysroot，否则 sys/cdefs.h 直接 #error
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android${ANDROID_API} -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E '^aarch64.*clang$' | head -20 || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk

      - name: Diagnostics
        run: |
          set +e
          echo "--- node/pnpm ---"; node -v; pnpm -v
          echo "--- java ---"; java -version 2>&1
          echo "--- rust ---"; rustc -vV
          echo "--- android ---"; echo "SDK=$ANDROID_HOME"; echo "NDK=$NDK_HOME"; echo "NDK_VER=$NDK_VERSION_DETECTED"
          echo "--- bindgen ---"; echo "$BINDGEN_EXTRA_CLANG_ARGS"

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Show tauri environment
        run: pnpm tauri info || true

      - name: Init Android project
        run: pnpm tauri android init --ci

      - name: Align ndkVersion in generated gradle
        run: |
          set -u
          f=src-tauri/gen/android/app/build.gradle.kts
          if [ -f "$f" ]; then
            echo "--- before ---"; grep -n 'ndkVersion' "$f" || true
            sed -i "s/ndkVersion = \"[^\"]*\"/ndkVersion = \"$NDK_VERSION_DETECTED\"/" "$f" || true
            echo "--- after ---"; grep -n 'ndkVersion' "$f" || true
          else
            echo "::warning::$f 不存在"
          fi

      - name: Build unsigned release APK
        run: |
          set +e
          pnpm tauri android build --apk --target aarch64 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          {
            echo "### cargo/android build exit code: ${rc}"
            echo '```text'
            grep -nE "error(\[|:)|^error|failed to|linking with|undefined reference|cannot find|Unable to generate|note: " build.log | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::build failed with exit code $rc"; fi
          exit "$rc"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Sign APK (self-build keystore)
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          echo "using build-tools $BT"
          KS="$RUNNER_TEMP/selfbuild.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=HGhub Self Build, O=Self, C=CN"
          mkdir -p out
          n=0
          while IFS= read -r f; do
            base="$(basename "$(dirname "$f")")"
            raw="out/HGhub_0.0.1_${base}_raw.apk"
            aligned="out/HGhub_0.0.1_${base}.apk"
            cp "$f" "$raw"
            "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -p -f 4 "$raw" "$aligned"
            rm -f "$raw"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --v4-signing-enabled false --out "$aligned.tmp" "$aligned"
            mv "$aligned.tmp" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$aligned" | head -5
            n=$((n+1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk')
          rm -f "$KS"
          [ "$n" -gt 0 ] || { echo "::error::没有找到 release APK"; exit 1; }
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-apk
          path: out/*.apk
          if-no-files-found: error
