# 放到你 fork 的 .github/workflows/HGhub-apk-build.yml（v2：容错 + 自诊断）
#
# 用法：Actions -> 左侧 "HGhub Android APK (self-build)" -> Run workflow
#       -> 底部 Artifacts 下载 HGhub-apk.zip -> 解压得到 HGhub_0.0.1_arm64.apk
#
# v2 相对 v1 的改动（针对 v1 在 2 分半就 exit 1 的情况）：
#   1. pnpm install 去掉 --frozen-lockfile（仓库 lockfile 与 package.json 可能已不同步）
#   2. SDK/NDK 逐个包安装并打印结果，某个包失败不会让整步无提示地挂掉
#   3. 增加 "Diagnostics" 步骤，把 java/node/pnpm/rust/sdk 版本全打出来
#   4. 增加 pnpm tauri info，直接暴露 SDK/NDK/Java 探测结果
name: HGhub Android APK (self-build)

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  KEY_ALIAS: "hghub"
  KS_PASS: "hghub-selfbuild"

jobs:
  apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # rquickjs-sys 会用 bindgen 生成绑定，需要 libclang；缺失时 rustc 报 exit 101
      - name: Install native build helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev llvm pkg-config
          clang --version | head -1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Android env
        run: |
          set -eu
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Detected SDK: $SDK"
          ls "$SDK" || true

      - name: Install Android SDK packages (tolerant)
        run: |
          set -u
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then echo "::error::sdkmanager not found at $SDKM"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"
          do
            echo "=== installing $pkg ==="
            if "$SDKM" --install "$pkg"; then echo "OK: $pkg"; else echo "::warning::FAILED to install $pkg"; fi
          done
          echo "=== installed ==="
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true
          ls "$SDK/ndk" 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk

      - name: Diagnostics
        run: |
          set +e
          echo "--- node/pnpm ---"; node -v; pnpm -v
          echo "--- java ---"; java -version 2>&1; echo "JAVA_HOME=$JAVA_HOME"
          echo "--- rust ---"; rustc -vV; cargo -V
          echo "--- android ---"; echo "SDK=$ANDROID_HOME NDK=$NDK_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null
          echo "--- npmrc / workspace ---"; cat .npmrc 2>/dev/null; cat pnpm-workspace.yaml 2>/dev/null

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Show tauri environment
        run: pnpm tauri info || true

      - name: Init Android project (gen/android 未提交，必须先 init)
        run: pnpm tauri android init --ci

      - name: Align NDK version in generated gradle
        run: |
          set -u
          f=src-tauri/gen/android/app/build.gradle.kts
          if [ -f "$f" ]; then
            echo "--- before ---"; grep -n 'ndkVersion\|compileSdk' "$f" || true
            sed -i "s/ndkVersion = \"[^\"]*\"/ndkVersion = \"$NDK_VERSION\"/" "$f" || true
            echo "--- after ----"; grep -n 'ndkVersion' "$f" || true
          else
            echo "::warning::$f 不存在，init 可能没成功"
          fi

      - name: Build unsigned release APK
        run: |
          set +e
          pnpm tauri android build --apk --target aarch64 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          {
            echo "### cargo/android build exit code: ${rc}"
            echo '```text'
            grep -nE "error(\[|:)|^error|failed to|linking with|undefined reference|cannot find|note: " build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::build failed with exit code $rc"; fi
          exit "$rc"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Sign APK (self-build keystore)
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          echo "using build-tools $BT"
          KS="$RUNNER_TEMP/selfbuild.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=HGhub Self Build, O=Self, C=CN"
          mkdir -p out
          n=0
          while IFS= read -r f; do
            base="$(basename "$(dirname "$f")")"
            raw="out/HGhub_0.0.1_${base}_raw.apk"
            aligned="out/HGhub_0.0.1_${base}.apk"
            cp "$f" "$raw"
            "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -p -f 4 "$raw" "$aligned"
            rm -f "$raw"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --v4-signing-enabled false --out "$aligned.tmp" "$aligned"
            mv "$aligned.tmp" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$aligned" | head -5
            n=$((n+1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk')
          rm -f "$KS"
          [ "$n" -gt 0 ] || { echo "::error::没有找到 release APK"; exit 1; }
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-apk
          path: out/*.apk
          if-no-files-found: error
